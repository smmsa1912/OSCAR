[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oscar-automation"
version = "0.1.0"
description = "OSCAR desktop automation agent"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "google-genai==1.7.0",
  "google-generativeai==0.8.4",
  "pyautogui==0.9.54",
  "Pillow==11.1.0",
  "mss==9.0.1",
  "python-dotenv==1.0.1",
  "PyGetWindow==0.0.9",
  "psutil==5.9.8",
  "pywin32==311; sys_platform == 'win32'",
  "pywinauto==0.6.8; sys_platform == 'win32'",
  "playwright==1.50.0",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
]

[tool.setuptools.packages.find]
include = ["oscar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
